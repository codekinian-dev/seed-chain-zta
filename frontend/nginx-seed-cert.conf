# Nginx config untuk Frontend Vue.js (Seed Certification)
# Letakkan di /etc/nginx/sites-available/seed-cert
# 
# sudo nano /etc/nginx/sites-available/seed-cert
# sudo ln -s /etc/nginx/sites-available/seed-cert /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# Setelah itu setup SSL:
# sudo certbot --nginx -d seed-cert.jabarchain.me

server {
    listen 80;
    server_name seed-cert.jabarchain.me;
    
    # Proxy ke Docker container frontend
    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

# HTTPS akan di-generate otomatis oleh Certbot
