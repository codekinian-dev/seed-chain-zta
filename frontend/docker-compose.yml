version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seed-frontend
    ports:
      - "3001:80"
    restart: unless-stopped
    networks:
      - seed-network
    environment:
      - NODE_ENV=production
    # Jika perlu connect ke backend, uncomment dan sesuaikan
    # depends_on:
    #   - backend

networks:
  seed-network:
    driver: bridge
