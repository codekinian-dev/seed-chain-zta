version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seed-frontend
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS
    volumes:
      # Mount SSL certificates
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    networks:
      - seed-network
    environment:
      - NODE_ENV=production
    # Jika perlu connect ke backend, uncomment dan sesuaikan
    # depends_on:
    #   - backend

networks:
  seed-network:
    driver: bridge
