groups:
  - name: application_alerts
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }}% over the last 5 minutes"

      # High response time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High API response time"
          description: "95th percentile response time is {{ $value }}s"

      # Authentication failures
      - alert: HighAuthFailureRate
        expr: rate(authentication_failures_total[5m]) > 5
        for: 2m
        labels:
          severity: high
          category: security
        annotations:
          summary: "High authentication failure rate"
          description: "{{ $value }} authentication failures per second"

      # Policy violations
      - alert: PolicyViolationSpike
        expr: rate(policy_violations_total[5m]) > 10
        for: 5m
        labels:
          severity: high
          category: security
        annotations:
          summary: "Spike in policy violations"
          description: "{{ $value }} policy violations per second"

  - name: security_alerts
    interval: 30s
    rules:
      # Suspicious activity
      - alert: SuspiciousActivity
        expr: rate(suspicious_activity_total[5m]) > 2
        for: 2m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Suspicious activity detected"
          description: "{{ $value }} suspicious events per second"

      # SQL injection attempts
      - alert: SqlInjectionAttempt
        expr: increase(security_events_total{type="SQL_INJECTION_ATTEMPT"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "SQL injection attempt detected"
          description: "{{ $value }} SQL injection attempts in the last 5 minutes"

      # Brute force attack
      - alert: BruteForceAttack
        expr: rate(authentication_failures_total[1m]) > 10
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Possible brute force attack"
          description: "{{ $value }} failed login attempts per second from same IP"

      # Off-hours access
      - alert: OffHoursAccess
        expr: off_hours_access_total > 0
        for: 1m
        labels:
          severity: medium
          category: security
        annotations:
          summary: "Access during restricted hours"
          description: "{{ $value }} access attempts during off-hours (22:00-06:00)"

  - name: infrastructure_alerts
    interval: 30s
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}"

      # Disk space low
      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Low disk space"
          description: "Disk usage is {{ $value }}% on {{ $labels.instance }}:{{ $labels.mountpoint }}"

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service is down"
          description: "{{ $labels.job }} has been down for more than 1 minute"

  - name: blockchain_alerts
    interval: 30s
    rules:
      # High blockchain transaction failure rate
      - alert: HighBlockchainFailureRate
        expr: rate(blockchain_transactions_failed_total[5m]) / rate(blockchain_transactions_total[5m]) > 0.1
        for: 5m
        labels:
          severity: high
          category: blockchain
        annotations:
          summary: "High blockchain transaction failure rate"
          description: "{{ $value }}% of blockchain transactions are failing"

      # Slow blockchain transactions
      - alert: SlowBlockchainTransactions
        expr: histogram_quantile(0.95, rate(blockchain_transaction_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
          category: blockchain
        annotations:
          summary: "Slow blockchain transactions"
          description: "95th percentile blockchain transaction time is {{ $value }}s"
