# Nginx config untuk serve TLS certificates
# Letakkan di /etc/nginx/sites-available/fabric-tls-certs
# 
# sudo ln -s /etc/nginx/sites-available/fabric-tls-certs /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name blockchain-tls.jabarchain.me;
    
    # Path ke folder TLS certificates
    # Folder tls-public dibuat oleh script setup-tls-public.sh
    root /root/blockchain/network/tls-public;
    
    # Allow directory listing
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    
    # CORS headers untuk akses dari aplikasi
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET, OPTIONS';
    
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
