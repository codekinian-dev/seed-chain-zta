---
name: "bpsbp-network-fabric-remote"
version: "1.0.0"
client:
  organization: BPSBP
  credentialStore:
    path: /tmp/bpsbp-kvs-remote
    cryptoStore:
      path: /tmp/bpsbp-cvs-remote
  # Client credentials - farmer1 with role_producer
  clientPrivateKey:
    path: ../credentials/farmer1/key.pem
  clientSignedCert:
    path: ../credentials/farmer1/cert.pem

channels:
  benihchannel:
    orderers:
      - orderer.jabarchain.me
    peers:
      pusat.chain-bpsbp.jabarchain.me:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true
      cert.chain-bpsbp.jabarchain.me:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true
      sekretariat.chain-disbun.jabarchain.me:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true
      digital.chain-disbun.jabarchain.me:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true

organizations:
  BPSBP:
    mspid: BPSBPBenihMSP
    peers:
      - pusat.chain-bpsbp.jabarchain.me
      - cert.chain-bpsbp.jabarchain.me
    certificateAuthorities:
      - ca-bpsbp

orderers:
  orderer.jabarchain.me:
    url: grpcs://152.42.164.128:7050
    grpcOptions:
      ssl-target-name-override: chain-orderer.jabarchain.me
      grpc-max-send-message-length: 15
      request-timeout: 180000
      grpc.max_receive_message_length: -1
    tlsCACerts:
      path: ../../application/tls-certs/orderer/orderer-tls-ca.crt

peers:
  pusat.chain-bpsbp.jabarchain.me:
    url: grpcs://152.42.164.128:7051
    grpcOptions:
      ssl-target-name-override: pusat.chain-bpsbp.jabarchain.me
      grpc.keepalive_time_ms: 600000
      request-timeout: 180000
      grpc.max_receive_message_length: -1
      grpc.max_send_message_length: -1
    tlsCACerts:
      path: ../../application/tls-certs/peers/pusat-tls-ca.crt

  cert.chain-bpsbp.jabarchain.me:
    url: grpcs://152.42.164.128:8051
    grpcOptions:
      ssl-target-name-override: cert.chain-bpsbp.jabarchain.me
      grpc.keepalive_time_ms: 600000
      request-timeout: 180000
      grpc.max_receive_message_length: -1
      grpc.max_send_message_length: -1
    tlsCACerts:
      path: ../../application/tls-certs/peers/cert-tls-ca.crt

  sekretariat.chain-disbun.jabarchain.me:
    url: grpcs://152.42.164.128:9051
    grpcOptions:
      ssl-target-name-override: sekretariat.chain-disbun.jabarchain.me
      grpc.keepalive_time_ms: 600000
      request-timeout: 180000
      grpc.max_receive_message_length: -1
      grpc.max_send_message_length: -1
    tlsCACerts:
      path: ../../application/tls-certs/peers/sekretariat-tls-ca.crt

  digital.chain-disbun.jabarchain.me:
    url: grpcs://152.42.164.128:10051
    grpcOptions:
      ssl-target-name-override: digital.chain-disbun.jabarchain.me
      grpc.keepalive_time_ms: 600000
      request-timeout: 180000
      grpc.max_receive_message_length: -1
      grpc.max_send_message_length: -1
    tlsCACerts:
      path: ../../application/tls-certs/peers/digital-tls-ca.crt

certificateAuthorities:
  ca-bpsbp:
    url: https://152.42.164.128:7054
    httpOptions:
      verify: false
    tlsCACerts:
      path: ../../application/tls-certs/ca/ca-bpsbp-tls.pem
    registrar:
      - enrollId: admin
        enrollSecret: adminpw
