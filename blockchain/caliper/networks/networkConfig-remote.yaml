name: Benih Certification Network
version: "2.0.0"
caliper:
  blockchain: fabric

channels:
  - channelName: benihchannel
    contracts:
      - id: benih-certification

organizations:
  - mspid: BPSBPBenihMSP
    identities:
      certificates:
        # Using appUser credentials from wallet (extracted via extract-wallet-creds.js)
        - name: appUser
          clientSignedCert:
            path: ./credentials/appUser/cert.pem
          clientPrivateKey:
            path: ./credentials/appUser/key.pem
    connectionProfile:
      path: ./networks/connection-remote.yaml
      discover: true
